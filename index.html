
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Board Demo</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
.card{max-width:420px;margin:25px auto;background:#1e293b;padding:22px;border-radius:18px}
h2{color:#60a5fa}
.signal{font-size:36px;font-weight:bold;margin:20px}
button{padding:13px;margin:5px;border:0;border-radius:9px;font-size:17px;font-weight:bold;background:#2563eb;color:white}
.note{font-size:13px;color:#cbd5e1;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>EUR/USD OTC</h2>
<p>১ মিনিট সিগন্যাল ডেমো</p>
<div class="signal" id="signal">WAIT</div>
<p id="reason">বিশ্লেষণ করতে নিচের বাটনে চাপ দিন</p>
<button onclick="analyze()">বিশ্লেষণ করুন</button>
<p class="note">এটি শুধু নমুনা ডেটার ডেমো। লাইভ মার্কেট ডেটা নয় এবং ট্রেডিং নির্দেশনা নয়।</p>
</div>
<script>
const samples = [
 {signal:"UP", reason:"নমুনা ক্যান্ডেলে ঊর্ধ্বমুখী প্রবণতা"},
 {signal:"DOWN", reason:"নমুনা ক্যান্ডেলে নিম্নমুখী প্রবণতা"},
 {signal:"WAIT", reason:"নমুনা ডেটায় স্পষ্ট দিক নেই"}
];
let index = 0;
function analyze(){
 const result = samples[index];
 document.getElementById("signal").textContent = result.signal;
 document.getElementById("reason").textContent = result.reason;
 index = (index + 1) % samples.length;
}
</script>
</body>
</html>
